<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Garage Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171a21'/%3E%3Cpolyline points='5,19 11,19 14,10 18,24 21,15 27,15' fill='none' stroke='%2322c55e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e1014;
    --card: #161920;
    --line: #252a34;
    --track: #232833;
    --text: #e7e9ee;
    --muted: #8a92a2;
    --accent: #5b9cf5;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --grey: #6b7280;
    --p-core: #5b9cf5;
    --e-core: #a78bfa;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --line: #e3e6eb;
      --track: #e9ecf1;
      --text: #14171c;
      --muted: #5d6676;
      --accent: #2f6fd6;
      --green: #16a34a;
      --yellow: #b7860b;
      --red: #dc2626;
      --p-core: #2f6fd6;
      --e-core: #7c5bd6;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .summary { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
  .summary span { display: inline-flex; align-items: center; gap: 6px; }
  .banner {
    display: none; margin: 12px 16px 0; padding: 10px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--red) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
    font-size: 14px;
  }
  .banner.show { display: block; }
  main {
    display: grid; gap: 16px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
    max-width: 1240px; margin: 0 auto;
  }
  main[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .name { font-weight: 650; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status b { color: var(--text); font-weight: 600; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grey); flex: none; }
  .dot.green  { background: var(--green);  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 22%, transparent); }
  .dot.red    { background: var(--red); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 55%, transparent); }
    50%      { box-shadow: 0 0 0 6px color-mix(in srgb, var(--red) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .dot.red { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); } }

  .hermes {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }
  .hermes .label { padding: 0; }
  .hermes-left { display: flex; align-items: center; gap: 12px; }

  .rows { padding: 2px 16px 6px; }
  .card.offline .rows, .card.offline .hermes { opacity: .45; }
  .row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
  .val { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-width: 0; }
  .big { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { font-size: 13px; color: var(--muted); }
  .sub b { color: var(--text); font-weight: 600; }
  .warn { color: var(--yellow) !important; }
  .hot  { color: var(--red) !important; }
  .push { margin-left: auto; }

  .bar { flex: 1 1 100%; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  .bar > i.warn { background: var(--yellow); }
  .bar > i.hot { background: var(--red); }

  .spark { width: 84px; height: 24px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .spark .area { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: none; }

  .cores { flex: 1 1 100%; display: flex; gap: 10px; align-items: flex-end; }
  .core-group { display: flex; flex-direction: column; gap: 3px; }
  .core-group .cg-label { font-size: 11px; color: var(--muted); }
  .core-bars { display: flex; gap: 2px; height: 22px; align-items: flex-end; }
  .core-bars i { width: 7px; min-height: 2px; border-radius: 2px; background: var(--p-core); transition: height .4s; }
  .core-group.e .core-bars i { background: var(--e-core); }
  .core-bars span { width: 7px; height: 100%; display: flex; align-items: flex-end; background: var(--track); border-radius: 2px; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty code { background: var(--card); border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; }
  .login { max-width: 340px; margin: 12vh auto 0; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .login[hidden] { display: none; }
  .login h2 { margin: 0 0 4px; font-size: 18px; }
  .login p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .login input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .login input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .login button { width: 100%; margin-top: 12px; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  .login button:disabled { opacity: .6; cursor: default; }
  .login .err { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 1.2em; }
  .logout { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 16px calc(20px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<header>
  <h1>Garage Monitor</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="summary" id="summary"></div>
    <button class="logout" id="logout" type="button" hidden onclick="logout()">Lock</button>
  </div>
</header>
<div class="banner" id="banner">Can't reach the hub. Retrying…</div>
<form class="login" id="login" hidden>
  <h2>Locked</h2>
  <p>Enter the viewer password to see the dashboard.</p>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
  <button type="submit" id="login-btn">Unlock</button>
  <div class="err" id="login-err" role="alert"></div>
</form>
<main id="machines"></main>
<footer id="footer">Loading…</footer>

<script>
const POLL_MS = 2000;

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => typeof v === "number" && isFinite(v);

function fmtBytes(n) {
  if (!num(n)) return "–";
  const gb = n / 1024 ** 3;
  return gb >= 1 ? gb.toFixed(1) + " GB" : Math.round(n / 1024 ** 2) + " MB";
}
function fmtRate(n) {
  if (!num(n)) return "–";
  if (n >= 1024 ** 2) return (n / 1024 ** 2).toFixed(1) + " MB/s";
  if (n >= 1024) return Math.round(n / 1024) + " KB/s";
  return Math.round(n) + " B/s";
}
function fmtDur(s) {
  if (!num(s)) return "–";
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s % 60}s`;
  return `${s}s`;
}
function level(v, warn, hot) {
  if (!num(v)) return "";
  return v >= hot ? "hot" : v >= warn ? "warn" : "";
}
function temp(v, warn, hot) {
  return num(v) ? `<span class="${level(v, warn, hot)}">${Math.round(v)}°C</span>` : "–";
}
function bar(pct, warn, hot) {
  const p = num(pct) ? Math.min(100, Math.max(0, pct)) : 0;
  return `<div class="bar"><i class="${level(pct, warn, hot)}" style="width:${p}%"></i></div>`;
}
function spark(values, min, max) {
  const pts = (values || []).filter(num);
  if (pts.length < 2) return `<svg class="spark" aria-hidden="true"></svg>`;
  const w = 84, h = 24, step = w / (pts.length - 1);
  const y = (v) => (h - 2) - ((Math.min(max, Math.max(min, v)) - min) / (max - min)) * (h - 4);
  const line = pts.map((v, i) => `${(i * step).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon class="area" points="0,${h} ${line} ${w},${h}"></polygon><polyline points="${line}"></polyline></svg>`;
}

// ---- status rules -------------------------------------------------------
function machineStatus(m) {
  const interval = (m.report && m.report.interval) || 2;
  const fresh = Math.max(10, interval * 5);
  if (m.age_s <= fresh) return { cls: "green", label: "Online", up: true };
  if (m.age_s <= 60) return { cls: "yellow", label: "Delayed", up: true };
  return { cls: "red", label: "Offline", up: false };
}
function hermesStatus(h, machineUp) {
  if (!machineUp) return { cls: "", label: "Unknown", detail: "machine offline" };
  if (h.state === "running")
    return { cls: "green", label: "Running", detail: `gateway up ${fmtDur(h.gateway_uptime_s)}` };
  if (h.state === "restarting")
    return { cls: "yellow", label: "Restarting",
             detail: num(h.gateway_uptime_s) ? `gateway up ${fmtDur(h.gateway_uptime_s)}` : "gateway down, supervisor active" };
  return { cls: "red", label: "Stopped", detail: "no Hermes gateway found" };
}

// ---- rendering ----------------------------------------------------------
function coreBars(cpu) {
  const pc = cpu.per_core || [];
  const group = (threads, cls, title) => !threads.length ? "" : `
    <div class="core-group ${cls}"><div class="core-bars">${threads.map((i) =>
      `<span><i style="height:${Math.max(2, pc[i] || 0)}%"></i></span>`).join("")}</div>
      <div class="cg-label">${title}</div></div>`;
  if (cpu.p_threads && cpu.e_threads) {
    return `<div class="cores">
      ${group(cpu.p_threads, "p", `Performance ${num(cpu.p_percent) ? Math.round(cpu.p_percent) + "%" : ""}`)}
      ${group(cpu.e_threads, "e", `Efficiency ${num(cpu.e_percent) ? Math.round(cpu.e_percent) + "%" : ""}`)}
    </div>`;
  }
  return `<div class="cores">${group(pc.map((_, i) => i), "p", `${pc.length} threads`)}</div>`;
}

function renderMachine(m) {
  const r = m.report || {};
  const cpu = r.cpu || {}, mem = r.mem || {}, disk = r.disk || {}, net = r.net || {}, pw = r.power || {};
  const g = r.gpu, h = r.hermes;
  const st = machineStatus(m);
  const statusText = st.cls === "green" ? `up ${fmtDur(r.uptime_s)}` : `last seen ${fmtDur(m.age_s)} ago`;

  let hermesHtml = "";
  if (h) {
    const hs = hermesStatus(h, st.up);
    hermesHtml = `<div class="hermes">
      <div class="hermes-left"><span class="label">Hermes</span>
        <span class="status"><span class="dot ${hs.cls}"></span><b>${hs.label}</b> · ${esc(hs.detail)}</span></div>
      <span class="sub">CPU <b>${num(h.cpu_percent) ? h.cpu_percent.toFixed(1) : "–"}%</b> · RAM <b>${fmtBytes(h.rss_bytes)}</b>${
        h.restarts ? ` · <span class="warn">${h.restarts} restart${h.restarts > 1 ? "s" : ""}</span>` : ""}</span>
    </div>`;
  }

  let gpuHtml;
  if (g && g.vendor === "amd") {
    gpuHtml = `<span class="big">${Math.round(g.busy || 0)}%</span>
      ${num(g.temp) ? `<span class="big">${temp(g.temp, 80, 90)}</span>` : ""}
      <span class="sub">${g.asleep ? "asleep" : num(g.hotspot) ? `hotspot ${temp(g.hotspot, 95, 105)}` : ""}</span>
      <span class="sub push">${num(g.gpu_w) ? `<b>${g.gpu_w.toFixed(0)} W</b> · ` : ""}${num(g.freq_mhz) ? g.freq_mhz + " MHz" : ""}${
        num(g.fan_rpm) ? ` · fan ${g.fan_rpm ? g.fan_rpm.toLocaleString() + " RPM" : "off"}` : ""}</span>
      ${num(g.vram_total) && g.vram_total > 0 ? `<span class="sub">VRAM <b>${fmtBytes(g.vram_used)}</b> of ${fmtBytes(g.vram_total)}</span>
      ${bar(100 * g.vram_used / g.vram_total, 85, 95)}` : ""}`;
  } else if (g) {
    const asleep = num(g.rc6) && g.rc6 >= 95 && (g.busy || 0) < 1;
    gpuHtml = `<span class="big">${Math.round(g.busy || 0)}%</span>
      <span class="sub">${asleep ? "asleep" : `${g.freq_mhz || 0} MHz`}</span>
      <span class="sub push">Chip power <b>${num(g.pkg_w) ? g.pkg_w.toFixed(1) + " W" : "–"}</b></span>`;
  } else {
    gpuHtml = `<span class="sub">${esc(r.gpu_error || "no data")}</span>`;
  }

  let powerHtml;
  if (pw.plugged === false) {
    powerHtml = `<span class="big warn">On battery</span>`;
  } else if (pw.plugged) {
    powerHtml = `<span class="big">🔌 ${pw.charger_w ? pw.charger_w + " W" : "AC"}</span>`;
  } else {
    powerHtml = `<span class="sub">No battery info</span>`;
  }
  if (num(pw.battery)) {
    powerHtml += `<span class="sub push">Battery <b class="${pw.battery < 20 ? "hot" : pw.battery < 35 && pw.plugged === false ? "warn" : ""}">${pw.battery}%</b>${
      pw.charge_limit && pw.charge_limit < 100 ? ` (limit ${pw.charge_limit})` : ""}</span>`;
  }

  return `<section class="card ${st.up ? "" : "offline"}">
    <div class="card-head">
      <div style="min-width:0"><div class="name">${esc(m.name)}</div>
        <div class="meta">${esc([cpu.model, r.os].filter(Boolean).join(" · "))}</div></div>
      <span class="status"><span class="dot ${st.cls}"></span><b>${st.label}</b> · ${statusText}</span>
    </div>
    ${hermesHtml}
    <div class="rows">
      <div class="row"><div class="label">CPU</div><div class="val">
        <span class="big ${level(cpu.percent, 80, 95)}">${num(cpu.percent) ? Math.round(cpu.percent) : "–"}%</span>
        ${spark(m.history && m.history.cpu, 0, 100)}
        <span class="big">${temp(cpu.temp, 75, 90)}</span>
        <span class="sub push">${num(cpu.freq_mhz) ? (cpu.freq_mhz / 1000).toFixed(1) + " GHz" : ""}</span>
        ${coreBars(cpu)}
      </div></div>
      <div class="row"><div class="label">GPU</div><div class="val">${gpuHtml}</div></div>
      <div class="row"><div class="label">RAM</div><div class="val">
        <span class="big">${fmtBytes(mem.used)}</span><span class="sub">of ${fmtBytes(mem.total)}</span>
        ${num(mem.temp) ? `<span class="sub push">${temp(mem.temp, 70, 85)}</span>` : ""}
        ${bar(mem.percent, 80, 92)}
      </div></div>
      <div class="row"><div class="label">Disk</div><div class="val">
        <span class="big">${num(disk.percent) ? Math.round(disk.percent) : "–"}%</span>
        <span class="sub">${fmtBytes(disk.used)} of ${fmtBytes(disk.total)}</span>
        ${num(disk.temp) ? `<span class="sub push">SSD ${temp(disk.temp, 60, 75)}</span>` : ""}
        ${bar(disk.percent, 80, 90)}
      </div></div>
      <div class="row"><div class="label">Fan</div><div class="val">
        <span class="big">${num(r.fan_rpm) ? r.fan_rpm.toLocaleString() + " RPM" : "–"}</span>
        <span class="sub push">Net ↓ <b>${fmtRate(net.rx_bps)}</b> ↑ <b>${fmtRate(net.tx_bps)}</b></span>
      </div></div>
      <div class="row"><div class="label">Power</div><div class="val">${powerHtml}</div></div>
    </div>
  </section>`;
}

function render(data) {
  const list = data.machines || [];
  const counts = { green: 0, yellow: 0, red: 0 };
  list.forEach((m) => counts[machineStatus(m).cls]++);
  document.getElementById("summary").innerHTML = [
    ["green", "online"], ["yellow", "delayed"], ["red", "offline"],
  ].filter(([c]) => counts[c]).map(([c, t]) => `<span><span class="dot ${c}"></span>${counts[c]} ${t}</span>`).join("");

  document.getElementById("machines").innerHTML = list.length
    ? list.map(renderMachine).join("")
    : `<div class="empty">No machines have reported yet.<br><br>On the machine, check the agent with<br>
       <code>systemctl status garage-monitor-agent</code></div>`;
  document.getElementById("footer").textContent =
    `Updated ${new Date().toLocaleTimeString()} · refreshes every ${POLL_MS / 1000}s`;
}

// ---- login ------------------------------------------------------------------
const TOKEN_KEY = "gm-session";
let token = "";
try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
function saveToken(t) {
  token = t || "";
  try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
}
function showLogin(show) {
  document.getElementById("login").hidden = !show;
  const machines = document.getElementById("machines");
  const footer = document.getElementById("footer");
  machines.hidden = show;
  footer.hidden = show;
  if (show) {
    clearTimeout(timer);
    pollController?.abort();
    machines.replaceChildren();
    footer.textContent = "Loading…";
    document.getElementById("summary").innerHTML = "";
    document.getElementById("banner").classList.remove("show");
    document.getElementById("logout").hidden = true;
    document.getElementById("password").focus();
  }
}
document.getElementById("login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("login-btn"), err = document.getElementById("login-err");
  const pw = document.getElementById("password");
  btn.disabled = true; err.textContent = "";
  try {
    const res = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ password: pw.value }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "Login failed.");
    saveToken(body.token);
    pw.value = "";
    showLogin(false);
    clearTimeout(timer);
    poll();
  } catch (e) {
    err.textContent = e.message === "Failed to fetch" ? "Can't reach the hub." : e.message;
  } finally {
    btn.disabled = false;
  }
});
function logout() {
  fetch("api/logout", { method: "POST", headers: { Authorization: "Bearer " + token } }).catch(() => {});
  saveToken("");
  showLogin(true);
}

let timer, pollController;
async function poll() {
  const { signal } = pollController = new AbortController();
  try {
    const res = await fetch("api/machines", { cache: "no-store", signal, headers: token ? { Authorization: "Bearer " + token } : {} });
    if (signal.aborted) return;
    if (res.status === 401) { saveToken(""); showLogin(true); return; }
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (signal.aborted) return;
    render(data);
    document.getElementById("banner").classList.remove("show");
    document.getElementById("logout").hidden = !token;
  } catch (e) {
    if (signal.aborted) return;
    document.getElementById("banner").classList.add("show");
  }
  timer = setTimeout(poll, POLL_MS);
}
poll();
</script>
</body>
</html>
